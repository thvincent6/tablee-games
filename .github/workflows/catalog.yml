# Publie le catalogue signé sur GitHub Pages à chaque changement de main : index.json (version
# suivante), index.json.sig et une copie exacte des jeux, aussi poussés sur la branche `catalog`
# (servie par jsDelivr, secours de Pages). La signature n'a lieu qu'après
# l'approbation manuelle exigée par l'environnement « release », seul à détenir la clé privée.
name: Catalogue signé

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Une publication à la fois : chacune lit la version publiée par la précédente.
concurrency:
  group: catalog
  cancel-in-progress: false

env:
  SITE_URL: https://thvincent6.github.io/tablee-games

jobs:
  sign:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Pour le miroir : la branche `catalog`, servie par jsDelivr en secours de Pages.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Sans scripts d'installation : aucun code de dépendance ne s'exécute à côté du secret.
      - run: npm ci --ignore-scripts
      - name: Catalogue publié
        run: |
          status=$(curl -sS -o previous.json -w '%{http_code}' "$SITE_URL/index.json")
          case "$status" in
            200) echo "previous=--previous previous.json" >> "$GITHUB_ENV" ;;
            404) echo "Aucun catalogue publié : première version." ;;
            # Sans la version publiée, impossible de garantir une version plus récente.
            *) echo "Catalogue publié illisible (HTTP $status)."; exit 1 ;;
          esac
      - name: Construire
        run: npm run catalog:build -- games site $previous
      - name: Pages du site (politique de confidentialité…)
        run: cp -r pages/. site/
      - name: Signer
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: npm run catalog:sign -- site/index.json
      - name: Vérifier avec la clé publique
        run: npm run catalog:verify -- site/index.json site/index.json.sig
      - name: Miroir pour jsDelivr (branche catalog)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd site
          git init -q -b catalog
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Catalogue version $(jq .version index.json)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" catalog
          rm -rf .git
          # jsDelivr garde une branche en cache plusieurs heures : on lui demande de la relire.
          for file in index.json index.json.sig; do
            curl -fsS "https://purge.jsdelivr.net/gh/${REPO}@catalog/${file}" > /dev/null || true
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
